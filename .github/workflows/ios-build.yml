name: Build iOS IPA

on:
  push:
    branches:
      - codex/ninebot-ant-bms
  workflow_dispatch:
    inputs:
      macos_runner:
        description: Standard macOS runner to use
        type: choice
        options:
          - macos-15
          - macos-15-intel
        default: macos-15
      capture_ui:
        description: Capture BMS settings and voltage trend previews in the iOS simulator
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build unsigned iOS app
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Inspect build tools
        run: |
          mkdir -p artifacts
          xcodebuild -version
          swift --version

      - name: Generate Xcode project
        run: python3 Tools/generate_project.py

      - name: Run core protocol tests
        shell: bash
        run: |
          set -o pipefail
          bash Tools/test.sh 2>&1 | tee artifacts/core-tests.log
          swiftc -parse-as-library Sources/TDSCarKitCore/ANTBMSProtocol.swift \
            Sources/TDSCarKitCore/ANTBMSSessionStatistics.swift \
            Sources/TDSCarKitCore/ANTBMSCardConfiguration.swift \
            App/VehicleProfileStore.swift Tools/ExperienceStoreSmoke.swift \
            -o "$RUNNER_TEMP/CarWithinExperienceStoreSmoke"
          "$RUNNER_TEMP/CarWithinExperienceStoreSmoke" | tee artifacts/profile-migration.log

      - name: Build iPhone and iPad app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project TDSCarKit.xcodeproj -scheme TDSCarKit \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/CarWithinBuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build 2>&1 | tee artifacts/ios-build.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          app_path="$RUNNER_TEMP/CarWithinBuild/Build/Products/Release-iphoneos/TDSCarKit.app"
          package_root="$RUNNER_TEMP/CarWithinPackage"
          test -d "$app_path"
          mkdir -p "$package_root/Payload"
          ditto "$app_path" "$package_root/Payload/TDSCarKit.app"
          (
            cd "$package_root"
            ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/artifacts/CarWithin-ninebot-ant-bms-unsigned.ipa"
          )
          shasum -a 256 artifacts/CarWithin-ninebot-ant-bms-unsigned.ipa > artifacts/SHA256SUMS.txt
          git rev-parse HEAD > artifacts/source-commit.txt
          cp App/TDSCarKit.entitlements artifacts/required-entitlements.plist
          printf '%s\n' 'Unsigned iOS build. Re-sign with your provisioning profile before installing.' \
            'CarPlay requires a valid accessory identity configured separately.' \
            'Wi-Fi features require Hotspot Configuration and Access WiFi Information signing capabilities.' \
            > artifacts/INSTALL.txt

      - name: Upload IPA and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CarWithin-ninebot-ant-bms-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  ui-preview:
    name: Capture iPhone UI previews
    if: github.event_name == 'workflow_dispatch' && inputs.capture_ui
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: python3 Tools/generate_project.py
      - name: Build simulator app
        shell: bash
        run: |
          mkdir -p ui-artifacts
          set -o pipefail
          xcodebuild -project TDSCarKit.xcodeproj -scheme TDSCarKit \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/CarWithinSimulator" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build 2>&1 | tee ui-artifacts/simulator-build.log
      - name: Capture BMS previews
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          def run(*args):
              return subprocess.check_output(args, text=True)
          data = json.loads(run('xcrun', 'simctl', 'list', 'devices', 'available', '--json'))
          devices = [device for runtime, values in data['devices'].items() if 'iOS' in runtime
                     for device in values if 'iPhone' in device['name']]
          if not devices:
              raise RuntimeError('No available iPhone simulator')
          device = next((d for d in devices if 'iPhone 16 Pro' == d['name']), devices[0])
          udid = device['udid']
          if device['state'] != 'Booted':
              run('xcrun', 'simctl', 'boot', udid)
          run('xcrun', 'simctl', 'bootstatus', udid, '-b')
          run('xcrun', 'simctl', 'status_bar', udid, 'override', '--time', '9:41', '--batteryState', 'charged', '--batteryLevel', '100')
          app = pathlib.Path(os.environ['RUNNER_TEMP']) / 'CarWithinSimulator/Build/Products/Debug-iphonesimulator/TDSCarKit.app'
          import plistlib
          bundle = plistlib.loads((app / 'Info.plist').read_bytes())['CFBundleIdentifier']
          run('xcrun', 'simctl', 'install', udid, str(app))
          for page in ['bms', 'bms-devices', 'bms-trend', 'bms-old-trend', 'bms-card', 'bms-order', 'wifi']:
              run('xcrun', 'simctl', 'launch', '--terminate-running-process', udid, bundle, '--open-settings', page)
              time.sleep(3)
              run('xcrun', 'simctl', 'io', udid, 'screenshot', f'ui-artifacts/{page}.png')
          run('xcrun', 'simctl', 'ui', udid, 'appearance', 'dark')
          run('xcrun', 'simctl', 'launch', '--terminate-running-process', udid, bundle, '--open-settings', 'bms-card')
          time.sleep(3)
          run('xcrun', 'simctl', 'io', udid, 'screenshot', 'ui-artifacts/bms-card-dark.png')
          pathlib.Path('ui-artifacts/device.txt').write_text(device['name'] + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CarWithin-ui-previews-${{ github.run_number }}
          path: ui-artifacts/
          retention-days: 14
