name: Build iOS IPA

on:
  push:
    branches:
      - codex/ninebot-ant-bms
  workflow_dispatch:
    inputs:
      macos_runner:
        description: Standard macOS runner to use
        type: choice
        options:
          - macos-15
          - macos-15-intel
        default: macos-15

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build unsigned iOS app
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Inspect build tools
        run: |
          mkdir -p artifacts
          xcodebuild -version
          swift --version

      - name: Generate Xcode project
        run: python3 Tools/generate_project.py

      - name: Run Ninebot pairing lifecycle tests
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          bash Tools/test_ninebot_pairing.sh 2>&1 | tee artifacts/ninebot-pairing-tests.log

      - name: Run core protocol tests
        shell: bash
        run: |
          set -o pipefail
          bash Tools/test_ninebot_canvas.sh 2>&1 | tee artifacts/ninebot-canvas-tests.log
          bash Tools/test_ninebot_sockets.sh 2>&1 | tee artifacts/ninebot-socket-tests.log
          bash Tools/test_bms.sh 2>&1 | tee artifacts/bms-tests.log
          bash Tools/test_bms_display.sh artifacts/bms-display-previews 2>&1 | tee artifacts/bms-display-tests.log
          bash Tools/test.sh 2>&1 | tee artifacts/core-tests.log
          bash Tools/test_upstream_sync.sh 2>&1 | tee artifacts/upstream-sync-tests.log
          swiftc -parse-as-library Sources/TDSCarKitCore/BMSFamily.swift \
            Sources/TDSCarKitCore/ANTBMSProtocol.swift \
            Sources/TDSCarKitCore/ANTBMSSessionStatistics.swift \
            Sources/TDSCarKitCore/ANTBMSCardConfiguration.swift \
            Sources/TDSCarKitCore/Localization.swift \
            Sources/TDSCarKitCore/ANTBMSRideRecords.swift \
            App/VehicleProfileStore.swift Tools/ExperienceStoreSmoke.swift \
            -o "$RUNNER_TEMP/CarWithinExperienceStoreSmoke"
          "$RUNNER_TEMP/CarWithinExperienceStoreSmoke" | tee artifacts/profile-migration.log

      - name: Verify ZEEHO and Tailing integration
        shell: bash
        run: |
          set -o pipefail
          instrument_check_status=0
          run_instrument_check() {
            local check_script="$1" check_log="$2"
            if ! bash "$check_script" 2>&1 | tee "artifacts/$check_log"; then
              instrument_check_status=1
            fi
          }
          if ! python3 Tools/verify_legacy62.py 2>&1 | tee artifacts/zeeho-legacy-tests.log; then
            instrument_check_status=1
          fi
          run_instrument_check Tools/test_zeeho_seplus.sh zeeho-seplus-tests.log
          run_instrument_check Tools/test_tailing_discovery.sh tailing-discovery-tests.log
          run_instrument_check Tools/test_zeeho_control.sh zeeho-control-tests.log
          run_instrument_check Tools/test_zeeho_bms.sh zeeho-bms-tests.log
          run_instrument_check Tools/test_zeeho62_handshake.sh zeeho62-handshake-tests.log
          run_instrument_check Tools/test_motorcycle.sh motorcycle-tests.log
          run_instrument_check Tools/test_shouqu.sh shouqu-tests.log
          run_instrument_check Tools/test_tailing.sh tailing-media-tests.log
          exit "$instrument_check_status"

      - name: Verify local identity packaging with generated test keys
        shell: bash
        run: |
          set -o pipefail
          python3 -m venv "$RUNNER_TEMP/CarWithinIdentityTools"
          "$RUNNER_TEMP/CarWithinIdentityTools/bin/python" -m pip install 'cryptography>=42,<51'
          "$RUNNER_TEMP/CarWithinIdentityTools/bin/python" Tools/test_package_identity.py 2>&1 | tee artifacts/identity-package-tests.log

      - name: Build iPhone and iPad app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project TDSCarKit.xcodeproj -scheme TDSCarKit \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/CarWithinBuild" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build 2>&1 | tee artifacts/ios-build.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          app_path="$RUNNER_TEMP/CarWithinBuild/Build/Products/Release-iphoneos/TDSCarKit.app"
          package_root="$RUNNER_TEMP/CarWithinPackage"
          test -d "$app_path"
          mkdir -p "$package_root/Payload"
          ditto "$app_path" "$package_root/Payload/TDSCarKit.app"
          (
            cd "$package_root"
            ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/artifacts/CarWithin-ninebot-ant-bms-unsigned.ipa"
          )
          shasum -a 256 artifacts/CarWithin-ninebot-ant-bms-unsigned.ipa > artifacts/SHA256SUMS.txt
          git rev-parse HEAD > artifacts/source-commit.txt
          cp App/TDSCarKit.entitlements artifacts/required-entitlements.plist
          cp Tools/package_identity.py artifacts/
          printf '%s\n' 'Unsigned iOS build. Re-sign with your provisioning profile before installing.' \
            'This CI IPA has NO bundled MFi identity. Re-signing alone does not add one.' \
            'Use the separately prepared bundled-identity IPA, or import your own working identity in the app.' \
            'Local packaging: python3 package_identity.py SOURCE.ipa --identity-directory LOCAL_FOLDER --output bundled-identity-unsigned.ipa (requires cryptography).' \
            'Wi-Fi features require Hotspot Configuration and Access WiFi Information signing capabilities.' \
            > artifacts/INSTALL.txt

      - name: Upload IPA and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CarWithin-ninebot-ant-bms-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
